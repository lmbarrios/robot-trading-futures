<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexTrader.AI &bull; Secure Authentication & Sign In</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --bg-dark: #0B0F19;
            --card-bg: #151C2C;
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #0284C7;
            --primary-glow: rgba(2, 132, 199, 0.4);
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .auth-card {
            background: var(--card-bg); border: 1px solid var(--primary); width: 100%; max-width: 450px;
            padding: 40px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); text-align: center;
        }

        .brand { font-size: 24px; font-weight: 800; color: white; margin-bottom: 8px; }
        .brand span { color: var(--primary); }

        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

        /* Social Auth Buttons */
        .btn-social {
            width: 100%; padding: 13px 20px; border-radius: 10px; border: 1px solid var(--card-border);
            background: #0B0F19; color: white; font-weight: 700; font-size: 14.5px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px;
            transition: all 0.2s;
        }
        .btn-social:hover { border-color: var(--primary); background: #121A2B; transform: translateY(-1px); }

        .divider { display: flex; align-items: center; color: var(--text-muted); font-size: 12px; margin: 24px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--card-border); }
        .divider span { padding: 0 12px; }

        /* Form Inputs */
        .form-group { margin-bottom: 16px; text-align: left; position: relative; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
        .input-wrapper { position: relative; }
        .form-group input {
            width: 100%; padding: 12px 42px 12px 16px; background: #0B0F19; border: 1px solid var(--card-border);
            border-radius: 8px; color: white; font-size: 14px; outline: none;
        }
        .form-group input:focus { border-color: var(--primary); }

        .toggle-password {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px;
        }

        .match-feedback { font-size: 12px; font-weight: 600; margin-top: 4px; display: none; }
        .match-success { color: var(--accent-green); }
        .match-error { color: var(--accent-red); }

        .btn-submit {
            width: 100%; background: linear-gradient(135deg, #0284C7, #0369A1); color: white; padding: 14px;
            border-radius: 8px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .toggle-auth { color: var(--primary); font-size: 13.5px; margin-top: 20px; cursor: pointer; font-weight: 600; display: inline-block; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand">⚡ ApexTrader<span>.AI</span></div>
        <div class="subtitle" id="authSubtitle">Secure Client Sign In</div>

        <!-- Social Auth Buttons -->
        <button class="btn-social" onclick="handleGoogleLogin()">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.29v3.15C3.26 21.3 7.35 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.29c-.8 1.6-1.26 3.4-1.26 5.42s.46 3.82 1.26 5.42l3.99-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.7 1.29 6.58l3.99 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
            Continue with Google Account
        </button>

        <button class="btn-social" onclick="handleAppleLogin()">
            <svg width="20" height="20" viewBox="0 0 170 170" fill="white"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-5.01.12-9.87-1.93-14.58-6.15-3.17-2.74-7.05-7.44-11.64-14.12-6.52-9.48-11.83-20.2-15.91-32.14-4.09-11.94-6.14-23.36-6.14-34.28 0-15.75 4.09-28.79 12.27-39.12 8.18-10.33 18.52-15.63 31.02-15.89 4.79 0 9.87 1.16 15.24 3.48 5.37 2.32 9.4 3.54 12.09 3.66 2.45 0 6.64-1.28 12.57-3.84 5.93-2.56 10.89-3.72 14.88-3.48 10.88.61 19.86 4.7 26.94 12.27-9.72 5.86-14.45 14.04-14.19 24.54.26 10.5 4.94 18.9 14.04 25.2 4.12 2.87 8.65 4.94 13.59 6.23-2.5 7.46-5.87 15.02-10.12 22.68zM119.22 31.09c0-7.33 2.65-14.36 7.95-21.09 5.3-6.73 11.91-10.5 19.83-11.31.25 1.04.38 1.95.38 2.74 0 7.33-2.67 14.47-8.01 21.42-5.34 6.95-12.01 10.74-20.01 11.37-.12-1.04-.14-2.09-.14-3.13z"/></svg>
            Continue with Apple / iCloud ID
        </button>

        <div class="divider"><span>OR WITH EMAIL</span></div>

        <!-- Form Section -->
        <form onsubmit="handleFormSubmit(event)">
            <!-- Full Name (Sign Up only) -->
            <div class="form-group" id="nameGroup" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="authName" placeholder="e.g. Alex Miller">
            </div>

            <!-- Email -->
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="authEmail" placeholder="alex.miller@example.com" required>
            </div>

            <!-- WhatsApp / Phone (Sign Up only) -->
            <div class="form-group" id="phoneGroup" style="display: none;">
                <label>WhatsApp / Phone Number (For VIP Community Access)</label>
                <input type="tel" id="authPhone" placeholder="+1 (555) 019-2834">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="authPassword" placeholder="••••••••••••" required oninput="validatePasswordMatch()">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('authPassword')">👁️</button>
                </div>
            </div>

            <!-- Confirm Password (ONLY shown on Sign Up / Registration) -->
            <div class="form-group" id="confirmPasswordGroup" style="display: none;">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="authConfirmPassword" placeholder="••••••••••••" oninput="validatePasswordMatch()">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('authConfirmPassword')">👁️</button>
                </div>
                <div class="match-feedback" id="matchFeedback"></div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">Sign In to Dashboard ➔</button>
        </form>

        <span class="toggle-auth" onclick="toggleAuthMode()" id="btnToggle">Don't have an account? Sign Up</span>
    </div>

    <script type="module">
        import { loginWithGoogle, loginWithApple, registerWithEmail, loginWithEmail } from '../assets/js/firebase-auth.js';

        let isSignUp = false;

        window.handleGoogleLogin = function() { loginWithGoogle(); };
        window.handleAppleLogin = function() { loginWithApple(); };

        window.togglePasswordVisibility = function(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === 'password' ? 'text' : 'password';
        };

        window.validatePasswordMatch = function() {
            if (!isSignUp) return;
            const pass = document.getElementById('authPassword').value;
            const confirm = document.getElementById('authConfirmPassword').value;
            const feedback = document.getElementById('matchFeedback');

            if (!confirm) {
                feedback.style.display = 'none';
                return;
            }

            feedback.style.display = 'block';
            if (pass === confirm) {
                feedback.className = 'match-feedback match-success';
                feedback.innerText = '🟢 Passwords match perfectly!';
            } else {
                feedback.className = 'match-feedback match-error';
                feedback.innerText = '🔴 Passwords do not match!';
            }
        };

        window.toggleAuthMode = function() {
            isSignUp = !isSignUp;
            document.getElementById('nameGroup').style.display = isSignUp ? 'block' : 'none';
            document.getElementById('phoneGroup').style.display = isSignUp ? 'block' : 'none';
            document.getElementById('confirmPasswordGroup').style.display = isSignUp ? 'block' : 'none';
            
            document.getElementById('authSubtitle').innerText = isSignUp ? 'Create your account with Password Verification' : 'Secure Client Sign In';
            document.getElementById('btnSubmit').innerText = isSignUp ? 'Create Account & Continue ➔' : 'Sign In to Dashboard ➔';
            document.getElementById('btnToggle').innerText = isSignUp ? 'Already have an account? Sign In' : "Don't have an account? Sign Up";
            validatePasswordMatch();
        };

        window.handleFormSubmit = function(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const confirmPassword = document.getElementById('authConfirmPassword').value;
            const phone = document.getElementById('authPhone').value;
            const name = document.getElementById('authName').value || 'Trader User';

            if (isSignUp) {
                if (password !== confirmPassword) {
                    alert('❌ Passwords do not match. Please verify your password confirmation.');
                    return;
                }
                if (phone) localStorage.setItem('apex_user_phone', phone);
                registerWithEmail(email, password, name);
            } else {
                loginWithEmail(email, password);
            }
        };
    </script>

</body>
</html>
